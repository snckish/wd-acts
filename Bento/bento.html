<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sudoku Stats</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="container py-2">
        <div class="row g-2">

            <!--L(t-b)-->
            <div class="col-12 col-md-3">
                <div class="row g-2">
                    <div class="col-12">
                        <div class="tile accent u3">
                            <p class="label">Streak</p>
                        </div>
                    </div>

                    <div class="col-12">
                        <div class="tile u1">
                            <p class="label">Best time?</p>
                        </div>
                    </div>
                </div>
            </div>

            <!--C-->
            <div class="col-12 col-md-6 order-first order-md-0">
                <div class="row g-2">
                    <div class="col-12">
                        <div class="tile dark u2">
                            <p class="label">Puzzles solved</p>
                        </div>
                    </div>
                    <div class="col-12 col-sm-7">
                        <div class="tile u2">
                            <p class="label">16×16 record</p>
                        </div>
                    </div>

                    <div class="col-12 col-sm-5">
                        <div class="tile u2">
                            <p class="label">Difficulty</p>
                            <div class="row g-0">
                                <div class="col-6">Easy</div>
                                <div class="col-6 text-end">00:13</div>
                            </div>

                            <div class="row g-0">
                                <div class="col-6">Medium</div>
                                <div class="col-6 text-end">00:13</div>
                            </div>

                            <div class="row g-0">
                                <div class="col-6">Hard</div>
                                <div class="col-6 text-end">00:13</div>
                            </div>

                            <div class="row g-0">
                                <div class="col-6">Expert</div>
                                <div class="col-6 text-end">00:13</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!--R-->
            <div class="col-12 col-md-3">
                <div class="row g-2">
                    <div class="col-12">
                        <div class="tile u2">
                            <p class="label">Win rate</p>
                            <p class="value">99.9% (SAFEGUARD)</p>
                        </div>
                    </div>

                    <div class="col-12">
                        <div class="tile u1">
                            <p class="label">Avg time</p>
                            <p class="value">13:13</p>
                        </div>
                    </div>
                    <div class="col-12">
                        <div class="tile u1">
                            <p class="label">Killer Sudoku</p>
                            <p class="value">126</p>
                        </div>
                    </div>
                </div>
            </div>

            <!--Bot-->
            <div class="col-12 col-md-8">
                <div class="tile u1">
                    <p class="label">Weekly Activity</p>
                    <p class="value">24 games</p>
                </div>
            </div>
            <div class="col-12 col-md-4">
                <div class="tile u1">
                    <p class="label">Daily challenge</p>
                    <p class="value">50/50</p>
                </div>
            </div>

        </div>
    </div>
</body>

</html>
