<!doctype html>
<html lang="en" data-bs-theme="dark">

<head>
    <title>Unreal Unearth</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <link href="unreal-unearth.css" rel="stylesheet" />
</head>

<body>

    <div class="container py-5">
        <div class="row g-5">

            <!-- leftside-->
            <div class="col-12 col-md-5">
                <div class="album-side">
                    <img id="albumImg" class="img-fluid album-img rounded-4" alt="Unreal Unearth">
                    <h1 class="album-title mt-4" id="albumTitle"></h1>
                    <p class="text-secondary" id="albumInfo"></p>
                </div>
            </div>

            <!-- rightside -->
            <div class="col-12 col-md-7">
                <div class="track-header d-flex gap-3 px-3 pb-2 mb-2 text-secondary small text-uppercase">
                    <div class="track-number text-center flex-shrink-0">#</div>
                    <div>Title</div>
                </div>
                <div id="tracks">
                    <!-- tracks here -->
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script>
        var album = {
            title: "Unreal Unearth",
            artist: "Hozier",
            year: "2023",
            image: "assets/img/raah.jpg",
            tracks: [
                { number: 1, title: "De Selby (Part 1)" },
                { number: 2, title: "De Selby (Part 2)" },
                { number: 3, title: "First Time" },
                { number: 4, title: "Francesca" },
                { number: 5, title: "I, Carrion (Icarian)" },
                { number: 6, title: "Eat Your Young" },
                { number: 7, title: "Damage Gets Done (feat. Brandi Carlile)" },
                { number: 8, title: "Who We Are" },
                { number: 9, title: "Son of Nyx" },
                { number: 10, title: "All Things End" },
                { number: 11, title: "To Someone From A Warm Climate (Uiscefhuaraithe)" },
                { number: 12, title: "Butchered Tongue" },
                { number: 13, title: "Anything But" },
                { number: 14, title: "Abstract (Psychopomp)" },
                { number: 15, title: "Unknown / Nth" },
                { number: 16, title: "First Light" }
            ]
        };

        // left-side
        document.getElementById("albumImg").src = album.image;
        document.getElementById("albumTitle").innerHTML = album.title;
        document.getElementById("albumInfo").innerHTML = album.artist + " &bull; " + album.year + " &bull; " + album.tracks.length + " songs";

        // right-side
        var elTracks = document.getElementById("tracks");
        for (var i = 0; i < album.tracks.length; i++) {
            elTracks.innerHTML +=
                `<div class="track-row d-flex align-items-center gap-3 rounded-3 px-3 py-2">
                    <div class="track-number text-secondary text-center flex-shrink-0">` + album.tracks[i].number + `</div>
                    <div>
                        <div class="track-title fw-semibold">` + album.tracks[i].title + `</div>
                        <div class="text-secondary small">` + album.artist + `</div>
                    </div>
                </div>`;
        }
    </script>
</body>

</html>
