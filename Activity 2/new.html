<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Drewcio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="new.css" rel="stylesheet" />
</head>

<body>

    <div class="container py-5">
        <div class="row g-5">

            <!-- leftside-->
            <div class="col-12 col-md-5">
                <div class="unreal-unearth">
                    <img id="unrealUnearth" class="img-fluid unreal-unearth rounded-4" alt="Unreal Unearth">
                    <h1 class="album-title mt-4" id="albumTitle"></h1>
                    <p class="text-secondary" id="albumInfo"></p>
                </div>
            </div>

            <!-- rightside -->
            <div class="col-12 col-md-7">
                <div class="d-flex gap-3 px-3 pb-2 mb-2">
                    <div class="">
                        <img src="unreal_unearth.jpg" alt="">
                    </div>
                </div>

                <div class="player mt-4">
                    <audio class="w-100" src="" controls></audio>
                </div>
            </div>

        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script>

        //
        var album = {
            title: "Wasteland, Baby!",
            artist: "Hozier",
            year: "2019",
            image: "assets/img/wasteland_baby.jpg",
            tracks: [
                { number: 1, title: "Nina Cried Power" },
                { number: 2, title: "Almost (Sweet Music)" },
                { number: 3, title: "Movement" },
                { number: 4, title: "No Plan" },
                { number: 5, title: "Nobody" },
                { number: 6, title: "To Noise Making (Sing)" },
                { number: 7, title: "As It Was" },
                { number: 8, title: "Shrike" },
                { number: 9, title: "Talk" },
                { number: 10, title: "Sunlight" },
                { number: 11, title: "Be" },
                { number: 12, title: "Dinner & Diatribes" },
                { number: 13, title: "Would That I" },
                { number: 14, title: "Wasteland, Baby!" }
            ]
        };

        // left-side
        document.getElementById("albumImg").src = album.image;
        document.getElementById("albumTitle").innerHTML = album.title;
        document.getElementById("albumInfo").innerHTML = album.artist + " &bull; " + album.year + " &bull; " + album.tracks.length + " songs";

        // right-side
        var elTracks = document.getElementById("tracks");
        for (var i = 0; i < album.tracks.length; i++) {
            elTracks.innerHTML +=
                `<div class="track-row d-flex align-items-center gap-3 rounded-3 px-3 py-2">
                    <div class="track-number text-secondary text-center flex-shrink-0">` + album.tracks[i].number + `</div>
                    <div>
                        <div class="track-title fw-semibold">` + album.tracks[i].title + `</div>
                        <div class="text-secondary small">` + album.artist + `</div>
                    </div>
                </div>`;
        }
    </script>
</body>

</html>
