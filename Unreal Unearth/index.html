<!doctype html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hozier | Unreal Unearth</title>
    <link rel="icon" type="image/jpeg" href="assets/img/unreal_unearth.jpg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
</head>

<body>
    <!--Hero-->
    <header class="hero-section d-flex align-items-end">
        <div class="container-xxl hero-inner pb-5">
            <div class="row">
                <div class="col-12 col-md-6 offset-md-6">
                    <p class="hero-artist mb-2" id="hero-artist"></p>
                    <h1 class="hero-title mb-4" id="hero-title"></h1>
                    <a href="#tracks" class="btn hero-btn" id="hero-btn"></a>
                </div>
            </div>
        </div>
    </header>

    <!--Songs-->
    <main class="container-xxl track-main px-4 py-5" id="tracks">
        <div id="track-list"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script>
        var album = {
            title: "Unreal Unearth",
            artist: "Hozier",
            year: "2023",
            color: "#d4a373",
            image: "assets/img/unreal_unearth.jpg",
            tracks: [
                { number: 1, title: "De Selby (Part 1)", spotifyId: "0CNRqG9WyCCmiRVn7H3jYu", lyricsUrl: "https://genius.com/Hozier-de-selby-part-1-lyrics", tags: ["folk", "slow burn"], note: "To the bliss of not knowing yourself <br> With all mirroring gone from the world" },
                { number: 2, title: "De Selby (Part 2)", spotifyId: "0v9TXfv0RTWEandaV41esE", lyricsUrl: "https://genius.com/Hozier-de-selby-part-2-lyrics", tags: ["folk", "dark"], note: "I'd still know you, not being shown you <br> I only need the workin' of my hands" },
                { number: 3, title: "First Time", spotifyId: "72JWw2zUvQ0mMAzCw4Zt04", lyricsUrl: "https://genius.com/Hozier-first-time-lyrics", tags: ["indie", "love"], note: "Infinitely suffering, but fighting off like all creation <br> The absence of itself, anyway" },
                { number: 4, title: "Francesca", spotifyId: "6v9nSUSbhWwxsNcJgMURt6", lyricsUrl: "https://genius.com/Hozier-francesca-lyrics", tags: ["love", "soulful"], note: "Heaven is not fit to house a love <br> Like you and I" },
                { number: 5, title: "I, Carrion (Icarian)", spotifyId: "6EGJWumbIeQvcShDwvWfPU", lyricsUrl: "https://genius.com/Hozier-i-carrion-icarian-lyrics", tags: ["myth", "rock"], note: "If these heights should bring my fall <br> Let me be your own <br> Icarian carrion" },
                { number: 6, title: "Eat Your Young", spotifyId: "5hIkTsKQhf1RdHoOVyEnTE", lyricsUrl: "https://genius.com/Hozier-eat-your-young-lyrics", tags: ["dark", "groove"], note: "Skinning the children for a war drum <br> Putting food on the table, selling bombs and guns <br> It's quicker and easier to eat your young." },
                { number: 7, title: "Damage Gets Done (feat. Brandi Carlile)", spotifyId: "4zoqifkk8gltEXAkYYi6rV", lyricsUrl: "https://genius.com/Hozier-damage-gets-done-lyrics", tags: ["duet", "folk"], note: "I don't know how the feeling ended <br> But I know being reckless and young <br> Is not how the damage gets done" },
                { number: 8, title: "Who We Are", spotifyId: "1N3Wu1KRfAbhnZ3ZpIHEQF", lyricsUrl: "https://genius.com/Hozier-who-we-are-lyrics", tags: ["anthem", "indie"], note: "This phantom life sharpens like an image <br> But it sharpens like a knife" },
                { number: 9, title: "Son of Nyx", spotifyId: "4V1Hauu3xrSNvGSLAKq6oO", lyricsUrl: "https://genius.com/Hozier-son-of-nyx-lyrics", tags: ["myth", "atmospheric"], note: "See how it shines <br> Why do we never run <br> Before our chance was gone?" },
                { number: 10, title: "All Things End", spotifyId: "3f7hczxExBHun8KjicimLE", lyricsUrl: "https://genius.com/Hozier-all-things-end-lyrics", tags: ["slow", "reflective"], note: "All that we intend is scrawled in sand <br> Or slips right through our hands" },
                { number: 11, title: "To Someone From A Warm Climate (Uiscefhuaraithe)", spotifyId: "2a3CYwwIEUrOJLHL3AE59A", lyricsUrl: "https://genius.com/Hozier-to-someone-from-a-warm-climate-uiscefhuarithe-lyrics", tags: ["love", "irish"], note: "I wish I could say <br> That the river of my arms have found the ocean <br> I wish I could say the cold lake water of my heart <br> Well, Christ, it's boilin' over" },
                { number: 12, title: "Butchered Tongue", spotifyId: "0dBeJ8IsYriEPtwIfADM7t", lyricsUrl: "https://genius.com/Hozier-butchered-tongue-lyrics", tags: ["folk", "history"], note: "You may never know your fortune <br> Until the distance has been shown between what is lost forever <br> And what can still be known" },
                { number: 13, title: "Anything But", spotifyId: "0GvfUK9GIS8gawSmjydRyZ", lyricsUrl: "https://genius.com/Hozier-anything-but-lyrics", tags: ["soulful", "love"], note: "If I was a riptide, I wouldn't take you out" },
                { number: 14, title: "Abstract (Psychopomp)", spotifyId: "7FfXPgPiX6ybrC8OD5kVPz", lyricsUrl: "https://genius.com/Hozier-abstract-psychopomp-lyrics", tags: ["myth", "dark"], note: "Darling, there's a part of me <br> I'm afraid will always be <br> Trapped within an abstract from a moment of my life" },
                { number: 15, title: "Unknown / Nth", spotifyId: "4KT78zl5sfWrHMw1PyyW6S", lyricsUrl: "https://genius.com/Hozier-unknown-nth-lyrics", tags: ["rock", "intense"], note: "Do you know I could break beneath the weight <br> Of the goodness, love, I still carry for you? <br> That I'd walk so far just to take <br> The injury of finally knowin' you?" },
                { number: 16, title: "First Light", spotifyId: "5rC8yrwcMOT4BjwpRhpp9v", lyricsUrl: "https://genius.com/Hozier-first-light-lyrics", tags: ["hopeful", "closer"], note: "The sky set to burst, the gold and the rust <br> The colour erupts <br> You fillin' my cup, the sun comin' up" }
            ]
        };

        document.getElementById("hero-title").textContent = album.title;
        document.getElementById("hero-artist").textContent = album.artist + ", " + album.year;
        document.getElementById("hero-btn").textContent = "Listen to all " + album.tracks.length + " songs";
        document.documentElement.style.setProperty("--accent", album.color);

        var list = document.getElementById("track-list");
        var html = "";

        for (var i = 0; i < album.tracks.length; i++) {
            var t = album.tracks[i];

            var noteHtml = t.note ? `<p class="track-note">` + t.note + `</p>` : ``;

            // lyrics URL
            var lyricsHtml = t.lyricsUrl
                ? `<a href="` + t.lyricsUrl + `" target="_blank" rel="noopener" class="lyrics-link">View lyrics</a>`
                : `<span class="lyrics-link disabled" aria-disabled="true">View lyrics</span>`;

            // spotify ID
            var playerHtml = t.spotifyId
                ? `<iframe class="track-embed" style="border-radius:12px"
            src="https://open.spotify.com/embed/track/` + t.spotifyId + `?theme=0"
            width="100%" height="152" frameBorder="0"
            title="` + t.title + `"
            allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
            loading="lazy"></iframe>`
                : ``;

            html += `
  <div class="track-row row align-items-center g-4">
    <div class="col-12 col-md-5">
      <div class="track-num">` + t.number + `</div>
      <h2 class="track-name">` + t.title + `</h2>
      ` + noteHtml + `
      ` + lyricsHtml + `
    </div>
    <div class="col-12 col-md-7">` + playerHtml + `</div>
  </div>`;
        }

        list.innerHTML = html;
    </script>
</body>

</html>
