<!doctype html>
<html lang="en" data-bs-theme="dark">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Open Library</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;500;600&display=swap"
    rel="stylesheet">
</head>

<body style="background-color: #0E1512; font-family: 'Literata', Georgia, serif;">
  <div class="container-fluid position-fixed top-0 z-1 shadow py-2"
    style="background-color: #151E19; border-bottom: 1px solid #263229;">
    <div class="row">
      <div class="col">
        <a href="lib.html" id="backlink" class="btn btn-outline-success btn-sm">Back to list</a>
      </div>
    </div>
  </div>

  <div class="container mt-5 pt-5" style="min-height: 70vh;">
    <div class="d-flex flex-wrap gap-4">
      <div style="flex: 1 1 220px; max-width: 280px;">
        <img src="" alt="Book cover" id="image" class="rounded-2 shadow"
          style="width: 100%; aspect-ratio: 2 / 3; object-fit: cover; background-color: #1C2822;">
      </div>

      <div style="flex: 2 1 320px;">
        <div class="h2 fw-semibold" id="name">
          <div class="spinner-border text-success" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
        </div>

        <div class="mt-2" id="meta"></div>

        <div class="h5 fw-semibold mt-4 mb-2">Synopsis</div>
        <div id="description" style="white-space: pre-line; max-width: 62ch; line-height: 1.8;"></div>
      </div>
    </div>
  </div>

  <div class="text-center py-4 mt-5" style="background-color: #151E19; border-top: 1px solid #263229;">
    <div class="small text-secondary">Book data and covers from the Open Library API.</div>
    <div class="small text-secondary">&copy; 2026 Open Library</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script>
    function capitalizeFirstLetter(str) {
      if (!str) return str;
      return str.charAt(0).toUpperCase() + str.slice(1);
    }

    function esc(str) {
      return String(str).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    var elName = document.getElementById("name");
    var elMeta = document.getElementById("meta");
    var elImage = document.getElementById("image");
    var elDescription = document.getElementById("description");
    var elBacklink = document.getElementById("backlink");

    const queryString = window.location.search;
    const urlParams = new URLSearchParams(queryString);
    const id = urlParams.get('id');
    const page = urlParams.get('page');
    const q = urlParams.get('q');

    if (page != null) {
      elBacklink.href = "lib.html?page=" + page + "&q=" + encodeURIComponent(q || '');
    }

    const noCover = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 180"><rect width="120" height="180" fill="#1C2822"/><path d="M60 70c-9-7-20-9-31-9v56c11 0 22 2 31 9 9-7 20-9 31-9V61c-11 0-22 2-31 9zM60 70v56" fill="none" stroke="#52B788" stroke-width="3" stroke-linejoin="round"/></svg>');

    const getBook = async () => {
      try {
        const response = await fetch('https://openlibrary.org/works/' + encodeURIComponent(id) + '.json');
        const book = await response.json();

        var coverId = book.covers ? book.covers.find(c => c > 0) : null;

        var description = book.description ? (book.description.value || book.description) : '';
        description = String(description)
          .split('\n---')[0]
          .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1')
          .trim();

        var meta = '';
        if (book.first_publish_date) {
          meta += '<div class="text-secondary mb-2">First published ' + esc(book.first_publish_date) + '</div>';
        }
        if (book.subjects) {
          book.subjects.slice(0, 6).forEach(subject => {
            meta += '<span class="badge text-bg-success fw-normal me-1 mb-1">' + esc(subject) + '</span>';
          });
        }

        document.title = book.title + ' | Open Library';
        elName.innerHTML = esc(capitalizeFirstLetter(book.title));
        elMeta.innerHTML = meta;
        elImage.src = coverId ? 'https://covers.openlibrary.org/b/id/' + coverId + '-L.jpg' : noCover;
        elDescription.innerHTML = description ? esc(description) : '<span class="text-secondary">No synopsis available for this book.</span>';
      } catch (error) {
        console.error("Error fetching book:", error);
        elName.innerHTML = "Book not found";
        elImage.src = noCover;
      }
    }

    elImage.onerror = function () {
      elImage.onerror = null;
      elImage.src = noCover;
    }

    if (id != null) {
      getBook();
    } else {
      elName.innerHTML = "No book selected.";
    }
  </script>
</body>

</html>
