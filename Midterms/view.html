<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Book</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="container-fluid bg-primary position-fixed top-0 z-1 shadow">
        <div class="row">
            <div class="col">
                <div class="text-center display-6 text-white py-3">Open Library</div>
            </div>
        </div>
    </div>

    <div class="container mt-5 pt-5">
        <div class="row">
            <div class="col">
                <a href="lib.html" id="backlink">
                    <div class="btn btn-outline-secondary">Back to list</div>
                </a>
            </div>
        </div>
    </div>

    <div class="container mt-3">
        <div class="row">
            <div class="col">
                <div class="card shadow rounded-5 p-5 text-center">

                    <div id="imageContainer" class="mx-auto rounded-3" style="width: 200px; height: 300px;">
                        <img src="" style="width: 100%;" class="rounded-3" id="image">
                    </div>

                    <div class="h3 my-3" id="name">
                        <div class="spinner-border" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </div>

                    <div class="text-muted mb-2" id="author"></div>

                    <div>
                        <span class="rounded-5 px-4 py-1 bg-light" id="type"></span>
                    </div>

                    <p class="mt-4 text-start" id="description"></p>

                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="script.js"></script>
    <script>
        var elName = document.getElementById("name");
        var elImage = document.getElementById("image");
        var elAuthor = document.getElementById("author");
        var elType = document.getElementById("type");
        var elDescription = document.getElementById("description");
        var elBacklink = document.getElementById("backlink");

        const queryString = window.location.search;
        const urlParams = new URLSearchParams(queryString);
        const id = urlParams.get('id');
        const page = urlParams.get('page');
        const q = urlParams.get('q');

        if (page != null) {
            elBacklink.href = "lib.html?page=" + page + "&q=" + encodeURIComponent(q == null ? '' : q);
        }

        const getBook = async () => {
            elName.innerHTML = "Loading " + id;
            elImage.src = "";
            elAuthor.innerHTML = "";
            elType.innerHTML = "";
            elDescription.innerHTML = "";

            const response = await fetch('https://openlibrary.org/works/' + id + '.json');
            const book = await response.json();

            var cover = book.covers ? book.covers[0] : null;
            var subject = book.subjects ? book.subjects[0] : 'Unknown';

            var description = '';
            if (book.description) {
                description = typeof book.description === 'string' ? book.description : book.description.value;
            }

            elName.innerHTML = capitalizeFirstLetter(book.title);
            elImage.src = getCover(cover, 'L');
            elType.innerHTML = subject;
            elDescription.innerHTML = description;

            if (book.authors && book.authors.length > 0) {
                const authorResponse = await fetch('https://openlibrary.org' + book.authors[0].author.key + '.json');
                const author = await authorResponse.json();
                elAuthor.innerHTML = author.name;
            }
        }

        if (id != null) {
            getBook();
        }
    </script>
</body>

</html>
