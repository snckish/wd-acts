<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Library</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
  <div class="container-fluid bg-primary position-fixed top-0 z-1 shadow">
    <div class="row">
      <div class="col">
        <div class="text-center display-6 text-white py-3">Bokbokbok</div>
      </div>
    </div>
  </div>

  <!--hero-->
  <div class="container-fluid d-flex align-items-center justify-content-center text-center"
    style="margin-top: 80px; min-height: 650px; background-image: linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)), url('assets/landland.png'); background-size: cover; background-position: center;">
    <div class="w-100" style="max-width: 600px;">
      <div class="display-4 fw-bold text-white">Find your next read</div>
      <div class="text-white mb-4">Browse the shelves or search for a book</div>
      <div class="d-flex flex-row">
        <input type="text" class="form-control rounded-start-pill" placeholder="Enter Book Title" id="searchInput">
        <div class="btn btn-light rounded-end-pill" onclick="searchBooks()">Search</div>
      </div>
    </div>
  </div>

  <div class="container mt-4">
    <nav aria-label="Page navigation example">
      <ul class="pagination">
        <li class="page-item"><a class="page-link" onclick="prev()">Previous</a></li>
        <li class="page-item"><a class="page-link" id="currentpage">1</a></li>
        <li class="page-item"><a class="page-link" onclick="next()">Next</a></li>
      </ul>
    </nav>
  </div>

  <div class="container">
    <div class="row" id="parent">

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script src="script.js"></script>

  <script>
    var elCurrentPage = document.getElementById("currentpage");
    var elParent = document.getElementById("parent");
    var inSearchInput = document.getElementById("searchInput");

    const queryString = window.location.search;
    const urlParams = new URLSearchParams(queryString);
    var page = urlParams.get('page');
    if (page == null) {
      page = 1;
    } else {
      page = parseInt(page);
    }

    var search = urlParams.get('q');
    if (search == null) {
      search = '';
    }
    inSearchInput.value = search;

    var defaultQuery = 'subject:fantasy';
    var lastBook = 240;
    var perPage = 12;
    var finalPage = Math.ceil(lastBook / perPage);

    const getBooks = async () => {
      elCurrentPage.innerHTML = page;
      elParent.innerHTML = `
        <div class="text-center my-5">
          <div class="spinner-border" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
        </div>
      `;

      var query = search == '' ? defaultQuery : search;

      const response = await fetch('https://openlibrary.org/search.json?q=' + encodeURIComponent(query) + '&limit=' + perPage + '&page=' + page + '&fields=key,title,author_name,cover_i,subject');
      const data = await response.json();

      lastBook = Math.min(data.numFound, 240);
      finalPage = Math.max(1, Math.ceil(lastBook / perPage));

      elParent.innerHTML = '';

      if (data.docs.length == 0) {
        elParent.innerHTML = '<div class="text-center my-5 h4">No books found</div>';
        return;
      }

      for (var i = 0; i < data.docs.length; i++) {
        const book = data.docs[i];

        var id = book.key.replace('/works/', '');
        var image = getCover(book.cover_i, 'M');
        var title = book.title;
        var author = book.author_name ? book.author_name[0] : 'Unknown author';
        var subject = book.subject ? book.subject[0] : 'Unknown';

        elParent.innerHTML += `
          <div class="col-12 col-md-4">
            <div class="card shadow-sm p-3 text-center my-3 h-100">
              <div class="mx-auto rounded-3" style="width: 150px; height: 220px; background-color: white;">
                <img class="w-100 h-100 rounded-3" style="object-fit: cover;" src="`+image+`">
              </div>
              <a style="text-decoration: none" class="text-body" href="view.html?id=`+id+`&page=`+page+`&q=`+encodeURIComponent(search)+`">
                <div class="h5 mt-3 mb-1">`+capitalizeFirstLetter(title)+`</div>
              </a>
              <div class="text-muted mb-2">`+author+`</div>
              <div class="mt-auto">
                <span class="rounded-pill px-3 py-1 bg-light">`+subject+`</span>
              </div>
            </div>
          </div>
        `;
      }
    }

    function searchBooks() {
      search = inSearchInput.value.trim();
      page = 1;
      getBooks();
    }

    inSearchInput.addEventListener('keydown', function (e) {
      if (e.key == 'Enter') {
        searchBooks();
      }
    });

    function prev() {
      page -= 1;
      if (page == 0) {
        page = finalPage;
      }
      getBooks();
    }

    function next() {
      page += 1;
      if (page > finalPage) {
        page = 1;
      }
      getBooks();
    }

    getBooks();
  </script>
</body>

</html>
