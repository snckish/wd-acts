<!doctype html>
<html lang="en" data-bs-theme="dark">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Open Library</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;500;600&display=swap" rel="stylesheet">
</head>

<body style="background-color: #0E1512; font-family: 'Literata', Georgia, serif;">
  <div class="container-fluid p-0" style="border-bottom: 1px solid #263229;">
    <div class="d-flex flex-wrap">
      <div class="d-flex flex-column p-5" style="flex: 5 1 380px; min-height: 80vh; background-color: #151E19;">
        <div>
          <img src="assets/logo.svg" alt="Open Library" style="height: 40px; filter: invert(1) hue-rotate(180deg);">
        </div>

        <div class="my-auto">
          <h1 class="h2 fw-semibold">Find your next read</h1>
          <p class="text-secondary mb-4">Browse the shelves or search for a book</p>

          <div class="d-flex flex-row" style="max-width: 420px;">
            <input type="text" class="form-control rounded-end-0" style="background-color: #0E1512; border-color: #263229;" placeholder="Enter book title" id="searchInput" aria-label="Book title">
            <button type="button" class="btn btn-success rounded-start-0" onclick="searchBooks()">Search</button>
          </div>

          <div class="mt-3">
            <button type="button" class="btn btn-outline-secondary btn-sm me-1 mb-1" style="color: #C9D6CC; border-color: #4A5A50;" onclick="searchSubject('fantasy')">Fantasy</button>
            <button type="button" class="btn btn-outline-secondary btn-sm me-1 mb-1" style="color: #C9D6CC; border-color: #4A5A50;" onclick="searchSubject('mystery')">Mystery</button>
            <button type="button" class="btn btn-outline-secondary btn-sm me-1 mb-1" style="color: #C9D6CC; border-color: #4A5A50;" onclick="searchSubject('science fiction')">Science fiction</button>
            <button type="button" class="btn btn-outline-secondary btn-sm me-1 mb-1" style="color: #C9D6CC; border-color: #4A5A50;" onclick="searchSubject('romance')">Romance</button>
            <button type="button" class="btn btn-outline-secondary btn-sm me-1 mb-1" style="color: #C9D6CC; border-color: #4A5A50;" onclick="searchSubject('history')">History</button>
          </div>
        </div>

        <a href="#books" class="text-decoration-none" style="color: #52B788;">Browse books</a>
      </div>

      <div style="flex: 7 1 380px; min-height: 50vh; background-image: linear-gradient(to right, #151E19 0%, rgba(21, 30, 25, .65) 20%, rgba(21, 30, 25, 0) 55%), linear-gradient(rgba(14, 21, 18, .3), rgba(14, 21, 18, .3)), url('assets/l.jpg'); background-size: cover; background-position: center;"></div>
    </div>
  </div>

  <div class="container py-5" id="books">
    <div class="h3 fw-semibold mb-3" id="listTitle">Fantasy Books</div>
    <div id="parent" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(max(190px, calc((100% - 4.5rem) / 4 - 1px)), 1fr)); gap: 1.5rem;"></div>

    <nav class="mt-4" aria-label="Page navigation">
      <ul class="pagination justify-content-center">
        <li class="page-item"><button type="button" class="page-link" onclick="prev()">Previous</button></li>
        <li class="page-item"><span class="page-link" id="currentPage">1</span></li>
        <li class="page-item"><button type="button" class="page-link" onclick="next()">Next</button></li>
      </ul>
    </nav>
  </div>

  <div class="text-center py-4" style="background-color: #151E19; border-top: 1px solid #263229;">
    <div class="small text-secondary">Book data and covers from the Open Library API.</div>
    <div class="small text-secondary">&copy; 2026 Open Library</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script>
    function capitalizeFirstLetter(str) {
      if (!str) return str;
      return str.charAt(0).toUpperCase() + str.slice(1);
    }

    function esc(str) {
      return String(str).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    var elCurrentPage = document.getElementById("currentPage");
    var elParent = document.getElementById("parent");
    var elListTitle = document.getElementById("listTitle");
    var inSearchInput = document.getElementById("searchInput");

    const queryString = window.location.search;
    const urlParams = new URLSearchParams(queryString);
    var page = parseInt(urlParams.get('page')) || 1;
    var search = urlParams.get('q') || '';
    inSearchInput.value = search.startsWith('subject:') ? '' : search;

    var defaultQuery = 'subject:fantasy';
    var perPage = 12;
    var finalPage = 1;
    var requestId = 0;
    var loaded = false;

    const noCover = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 180"><rect width="120" height="180" fill="#1C2822"/><path d="M60 70c-9-7-20-9-31-9v56c11 0 22 2 31 9 9-7 20-9 31-9V61c-11 0-22 2-31 9zM60 70v56" fill="none" stroke="#52B788" stroke-width="3" stroke-linejoin="round"/></svg>');

    function listHeading() {
      if (search == '') return 'Fantasy Books';
      if (search.startsWith('subject:')) return capitalizeFirstLetter(esc(search.slice(8))) + ' books';
      return 'Results for “' + esc(search) + '”';
    }

    const getBooks = async () => {
      var thisRequest = ++requestId;
      var query = search == '' ? defaultQuery : search;
      loaded = false;

      elListTitle.innerHTML = listHeading();
      elCurrentPage.innerHTML = page;
      elParent.innerHTML = `
        <div class="d-flex justify-content-center my-4" style="grid-column: 1 / -1;">
          <div class="spinner-border text-success" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
        </div>
      `;

      var data;

      try {
        const response = await fetch('https://openlibrary.org/search.json?q=' + encodeURIComponent(query) + '&limit=' + perPage + '&page=' + page + '&fields=key,title,author_name,cover_i,subject');
        data = await response.json();
      } catch (error) {
        if (thisRequest != requestId) return;
        loaded = true;
        elParent.innerHTML = `
          <div class="text-center text-secondary" style="grid-column: 1 / -1;">
            <p>Could not load books. Check your connection and try again.</p>
            <button type="button" class="btn btn-success" onclick="getBooks()">Try again</button>
          </div>
        `;
        return;
      }

      if (thisRequest != requestId) return;
      loaded = true;

      finalPage = Math.max(1, Math.ceil(Math.min(data.numFound, 240) / perPage));
      elCurrentPage.innerHTML = page + ' / ' + finalPage;

      if (data.docs.length == 0) {
        elParent.innerHTML = '<div class="text-center text-secondary my-4" style="grid-column: 1 / -1;">No books found. Check the spelling, or try a genre at the top of the page.</div>';
        return;
      }

      elParent.innerHTML = '';
      data.docs.forEach(book => {
        var id = book.key.replace('/works/', '');
        var image = book.cover_i ? 'https://covers.openlibrary.org/b/id/' + book.cover_i + '-M.jpg' : noCover;
        var title = book.title ? book.title : 'Untitled';
        var author = book.author_name ? book.author_name[0] : 'Unknown author';
        var subject = book.subject ? book.subject[0] : '';

        elParent.innerHTML += `
          <div class="card shadow-sm h-100 position-relative overflow-hidden" style="background-color: #151E19; transition: transform .2s, border-color .2s;"
            onmouseenter="this.style.transform = 'translateY(-4px)'; this.style.borderColor = '#198754'; this.classList.replace('shadow-sm', 'shadow-lg'); this.querySelector('img').style.transform = 'scale(1.05)';"
            onmouseleave="this.style.transform = ''; this.style.borderColor = ''; this.classList.replace('shadow-lg', 'shadow-sm'); this.querySelector('img').style.transform = '';">
            <div class="overflow-hidden">
              <img class="card-img-top" style="aspect-ratio: 2 / 3; object-fit: cover; background-color: #1C2822; color: transparent; transition: transform .4s;" src="` + image + `" alt="Cover of ` + esc(title) + `" loading="lazy" onerror="this.onerror=null; this.src=noCover">
            </div>
            <div class="card-body d-flex flex-column">
              <a class="stretched-link text-decoration-none text-body" href="view.html?id=` + encodeURIComponent(id) + `&page=` + page + `&q=` + encodeURIComponent(search) + `">
                <div class="fw-semibold" style="display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">` + esc(capitalizeFirstLetter(title)) + `</div>
              </a>
              <div class="small text-secondary text-truncate">` + esc(author) + `</div>
              ` + (subject ? `<div class="mt-auto pt-2"><span class="badge text-bg-success d-inline-block mw-100 text-truncate">` + esc(subject) + `</span></div>` : '') + `
            </div>
          </div>
        `;
      });
    }

    function scrollToList() {
      document.getElementById("books").scrollIntoView({ behavior: 'smooth' });
    }

    function searchBooks() {
      search = inSearchInput.value.trim();
      page = 1;
      getBooks();
      scrollToList();
    }

    function searchSubject(name) {
      inSearchInput.value = '';
      search = 'subject:' + name;
      page = 1;
      getBooks();
      scrollToList();
    }

    inSearchInput.addEventListener('keydown', function (e) {
      if (e.key == 'Enter') {
        searchBooks();
      }
    });

    function prev() {
      if (!loaded) return;
      page -= 1;
      if (page < 1) {
        page = finalPage;
      }
      getBooks();
      scrollToList();
    }

    function next() {
      if (!loaded) return;
      page += 1;
      if (page > finalPage) {
        page = 1;
      }
      getBooks();
      scrollToList();
    }

    getBooks();

    if (urlParams.has('page') || urlParams.has('q')) {
      document.getElementById("books").scrollIntoView();
    }
  </script>
</body>

</html>
